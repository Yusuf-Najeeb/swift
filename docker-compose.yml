# Swift Writer — local full stack
#
# 1. Copy .env.example to .env in the project root and set OPENROUTER_API_KEY.
# 2.  docker compose up --build
# 3. Open http://localhost:3000  (Next.js) — API is http://localhost:8000

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        # 1 = production (nodejs/npm for `npx` / Serper). Use 0 for a slimmer, faster build.
        WITH_NODE: "1"
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Browser talks to the host at :3000; CORS for the app origin.
      SWIFT_CORS_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
      # Same as root .env; BFF in `frontend` needs it too
      SWIFT_API_BEARER_TOKEN: ${SWIFT_API_BEARER_TOKEN:-}
    volumes:
      - articles_data:/app/backend/articles
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://backend:8000
    ports:
      - "3000:3000"
    environment:
      # BFF read order: SWIFT_BACKEND_URL, then NEXT_PUBLIC; runtime first avoids stale baked build args.
      SWIFT_BACKEND_URL: http://backend:8000
      NEXT_PUBLIC_API_URL: http://backend:8000
      # Injected at compose parse time from project .env; do not use
      # env_file here — avoid giving the Next container the OpenRouter key.
      SWIFT_API_BEARER_TOKEN: ${SWIFT_API_BEARER_TOKEN:-}
    depends_on:
      backend:
        condition: service_healthy

volumes:
  articles_data:
