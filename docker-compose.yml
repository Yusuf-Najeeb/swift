
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        WITH_NODE: "1"
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      SWIFT_CORS_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
      SWIFT_API_BEARER_TOKEN: ${SWIFT_API_BEARER_TOKEN:-}
    volumes:
      - articles_data:/app/backend/articles
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://backend:8000
    ports:
      - "3000:3000"
    environment:
      SWIFT_BACKEND_URL: http://backend:8000
      NEXT_PUBLIC_API_URL: http://backend:8000
      SWIFT_API_BEARER_TOKEN: ${SWIFT_API_BEARER_TOKEN:-}
    depends_on:
      backend:
        condition: service_healthy

volumes:
  articles_data:
