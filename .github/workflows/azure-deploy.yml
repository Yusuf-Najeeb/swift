name: Azure — build and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-azure-${{ github.ref }}
  cancel-in-progress: true

env:
  BACKEND_APP_NAME: swift-backend
  FRONTEND_APP_NAME: swift-frontend
  BACKEND_IMAGE_NAME: swift-backend
  FRONTEND_IMAGE_NAME: swift-frontend

jobs:
  verify:
    name: Verify (build / import checks)
    runs-on: ubuntu-latest
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY != '' && secrets.OPENROUTER_API_KEY || 'ci-placeholder-not-used' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Python — sync and import app
        run: |
          uv sync --group dev
          uv run python -c "import backend.main; print('backend import ok')"
          uv run pytest

      - name: Frontend — install and production build
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: next build
        working-directory: frontend
        run: |
          npm ci
          npx next build
        env:
          NEXT_PUBLIC_API_URL: "http://127.0.0.1:8000"

  deploy:
    name: Build, push, update Container Apps
    needs: verify
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Resolve resource group
        id: rg
        env:
          RG_VAR: ${{ vars.AZURE_RESOURCE_GROUP }}
          RG_SECRET: ${{ secrets.AZURE_RESOURCE_GROUP }}
        run: |
          set -euo pipefail
          if [ -n "$RG_VAR" ]; then
            RG="$RG_VAR"
          else
            RG="$RG_SECRET"
          fi
          RG=$(printf '%s' "$RG" | tr -d ' \r\n')
          if [ -z "$RG" ]; then
            echo "AZURE_RESOURCE_GROUP is empty. In this repository, add:" >&2
            echo "  Settings → Actions → Variables: name AZURE_RESOURCE_GROUP, value = your Azure resource group" >&2
            echo "  (e.g. rg-swift-writer — same as resource_group_name in terraform.tfvars.)" >&2
            echo "  You can use a variable or a secret with that exact name." >&2
            exit 1
          fi
          echo "resource_group=$RG" >> "$GITHUB_OUTPUT"
          echo "Using resource group: $RG"

      - name: Resolve ACR and image tag
        id: meta
        env:
          ACR_NAME_VAR: ${{ vars.ACR_NAME }}
          ACR_NAME_SECRET: ${{ secrets.ACR_NAME }}
        run: |
          set -euo pipefail
          if [ -n "$ACR_NAME_VAR" ]; then
            ACR_NAME_RAW="$ACR_NAME_VAR"
          else
            ACR_NAME_RAW="$ACR_NAME_SECRET"
          fi
          r=$(printf '%s' "$ACR_NAME_RAW" | tr -d ' \r\n' | tr '[:upper:]' '[:lower:]')
          r="${r#https://}"
          r="${r#http://}"
          r="${r%%/*}"
          if [[ "$r" == *".azurecr.io"* ]]; then
            r="${r%%.azurecr.io*}"
          fi
          ACR_NAME="$r"
          if ! [[ "$ACR_NAME" =~ ^[a-z0-9]{5,50}$ ]]; then
            echo "ACR_NAME is missing or invalid. Set the ACR *short* name in this repository:" >&2
            echo "  Settings → Secrets and variables → Actions → Variables: name ACR_NAME, value e.g. swiftwriteracr90976535362" >&2
            echo "  (Or use a secret named ACR_NAME with the same value.)" >&2
            echo "  Use 5–50 letters/digits only — not yourregistry.azurecr.io" >&2
            echo "  For fork/cross-repo runs, add the variable on the repo that owns the workflow (often the upstream), not only on a fork." >&2
            echo "After normalization, value was empty or not alphanumeric — check for a typo in the variable name (must be exactly ACR_NAME)." >&2
            exit 1
          fi
          ACR_SERVER="${ACR_NAME}.azurecr.io"
          TAG="${GITHUB_SHA:0:12}"
          echo "acr_name=$ACR_NAME" >> "$GITHUB_OUTPUT"
          echo "acr_server=$ACR_SERVER" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Using registry $ACR_NAME -> $ACR_SERVER  tag=$TAG"

      - name: Log in to ACR
        run: az acr login -n "${{ steps.meta.outputs.acr_name }}"

      - name: Build and push backend
        env:
          BACKEND_WITH_NODE: ${{ vars.BACKEND_WITH_NODE }}
        run: |
          set -euo pipefail
          W="${BACKEND_WITH_NODE:-0}"
          docker build -f backend/Dockerfile \
            --build-arg "WITH_NODE=${W}" \
            -t "${{ steps.meta.outputs.acr_server }}/${{ env.BACKEND_IMAGE_NAME }}:${{ steps.meta.outputs.tag }}" \
            .
          docker push "${{ steps.meta.outputs.acr_server }}/${{ env.BACKEND_IMAGE_NAME }}:${{ steps.meta.outputs.tag }}"

      - name: Update backend Container App
        run: |
          set -euo pipefail
          az containerapp update \
            -g "${{ steps.rg.outputs.resource_group }}" \
            -n "${{ env.BACKEND_APP_NAME }}" \
            --image "${{ steps.meta.outputs.acr_server }}/${{ env.BACKEND_IMAGE_NAME }}:${{ steps.meta.outputs.tag }}"

      - name: Public backend URL for Next.js
        id: be
        run: |
          FQDN="$(az containerapp show \
            -g "${{ steps.rg.outputs.resource_group }}" \
            -n "${{ env.BACKEND_APP_NAME }}" \
            -o tsv --query "properties.configuration.ingress.fqdn" || true)"
          if [ -z "$FQDN" ] || [ "$FQDN" = "null" ]; then
            echo "Could not read backend FQDN (is ingress external on the backend app?)" >&2
            exit 1
          fi
          URL="https://${FQDN}"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "BACKEND_URL=$URL"

      - name: Build and push frontend
        run: |
          set -euo pipefail
          docker build -f frontend/Dockerfile frontend \
            --build-arg "NEXT_PUBLIC_API_URL=${{ steps.be.outputs.url }}" \
            -t "${{ steps.meta.outputs.acr_server }}/${{ env.FRONTEND_IMAGE_NAME }}:${{ steps.meta.outputs.tag }}"
          docker push "${{ steps.meta.outputs.acr_server }}/${{ env.FRONTEND_IMAGE_NAME }}:${{ steps.meta.outputs.tag }}"

      - name: Update frontend Container App (if it exists)
        run: |
          set -euo pipefail
          if ! az containerapp show -g "${{ steps.rg.outputs.resource_group }}" -n "${{ env.FRONTEND_APP_NAME }}" -o table &>/dev/null; then
            echo "No Container App named ${{ env.FRONTEND_APP_NAME }} — skip (set frontend_image in Terraform and apply first)."
            exit 0
          fi
          az containerapp update \
            -g "${{ steps.rg.outputs.resource_group }}" \
            -n "${{ env.FRONTEND_APP_NAME }}" \
            --image "${{ steps.meta.outputs.acr_server }}/${{ env.FRONTEND_IMAGE_NAME }}:${{ steps.meta.outputs.tag }}" \
            --set-env-vars "SWIFT_BACKEND_URL=${{ steps.be.outputs.url }} NEXT_PUBLIC_API_URL=${{ steps.be.outputs.url }}"
